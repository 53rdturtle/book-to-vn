<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>book-to-vn editor</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<header>
  <h1>book-to-vn</h1>
  <div class="bundle-bar">
    <label>Bundle dir <input id="bundle-dir" type="text" placeholder="out/short" size="40" /></label>
    <button id="refresh-bundle">Refresh</button>
  </div>
</header>

<main>
  <section class="panel">
    <h2>Source</h2>
    <label>Source text (paste or load a .txt)
      <input type="file" id="src-file" accept=".txt,text/plain" />
      <textarea id="src-text" rows="12" placeholder="Paste novel / chapter text..."></textarea>
    </label>
    <label>Image generation
      <select id="image-gen">
        <option value="placeholder">placeholder (fast)</option>
        <option value="nanobanana" selected>nanobanana (real images)</option>
      </select>
    </label>
    <label><input type="checkbox" id="no-cache" /> Bypass Gemini timeline cache (force re-call per chapter)</label>
    <label><input type="checkbox" id="skip-confirm" /> Auto-accept all confirmations</label>
    <div class="action-row">
      <button id="start-btn" class="primary">Start pipeline</button>
      <button id="play-btn" class="primary">Play</button>
      <span id="play-status"></span>
    </div>
  </section>

  <section class="panel" id="timeline">
    <h2>Progress</h2>
    <div id="steps"></div>
  </section>

  <section class="panel">
    <h2>Assets</h2>
    <div id="assets-view"></div>
  </section>

  <section class="panel">
    <details id="debug-panel" open>
      <summary><h2 style="display:inline">Debug log</h2></summary>
      <div class="action-row">
        <button id="clear-debug">Clear</button>
        <label><input type="checkbox" id="debug-autoscroll" checked /> Autoscroll</label>
      </div>
      <pre id="debug-log"></pre>
    </details>
  </section>
</main>

<div id="status-bar" class="status-bar" hidden>
  <span id="status-spinner" class="spinner"></span>
  <span id="status-line" class="status"></span>
</div>
<div id="lightbox" class="lightbox" hidden><img id="lightbox-img" alt="" /></div>
<script src="/static/app.js"></script>
</body>
</html>
